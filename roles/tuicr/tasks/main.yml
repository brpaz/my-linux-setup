- name: Get latest release
  community.general.github_release:
    action: latest_release
    user: agavra
    repo: tuicr
    token: "{{ github_token }}"
  register: tuicr_release

- name: Download
  ansible.builtin.unarchive:
    dest: "{{ setup_dir }}"
    src: https://github.com/agavra/tuicr/releases/download/{{ tuicr_release.tag }}/tuicr-{{ tuicr_release.tag[1:] }}-x86_64-unknown-linux-gnu.tar.gz
    remote_src: true
    mode: "0644"

- name: Install
  ansible.builtin.copy:
    src: "{{ setup_dir }}/tuicr"
    dest: "{{ bin_dir }}/tuicr"
    mode: a+x
  become: true
