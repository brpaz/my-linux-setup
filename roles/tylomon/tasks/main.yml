---
- name: Get latest release
  community.general.github_release:
    action: latest_release
    user: brpaz
    repo: tylomon
    token: "{{ github_token }}"
  register: tylomon_release

- name: Install
  ansible.builtin.get_url:
    url: https://github.com/brpaz/tylomon/releases/download/{{ tylomon_release.tag }}/tylomon
    dest: "{{ bin_dir }}/tylomon"
    mode: a+x
  become: true
