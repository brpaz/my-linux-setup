---
# Primary upstream DNS servers (tested first)
# Index 0 (home server) is excluded from the static upstream list and
# instead managed dynamically by dns-home-probe based on reachability -
# see roles/dns/templates/90-dns-home-probe.sh.j2
dns_upstream_servers:
  - "192.168.1.10"
  - "127.0.0.1#55353"
  - "1.1.1.1" # fallback dns to cloudflare if any of previous resolvers are down

# Host/port used to probe home server reachability (LAN at home, or via
# Tailscale away with accept-routes). Derived from dns_upstream_servers[0].
dns_home_server_host: "{{ dns_upstream_servers[0].split('#')[0] }}"
dns_home_server_port: "{{ dns_upstream_servers[0].split('#')[1] | default(53) }}"
dns_home_probe_timeout: 1

# DNS cache configuration
dns_cache_size: 5000
dns_min_ttl: 300

# DNS-over-HTTPS configuration (fallback when primary is down)
dns_dnscrypt_enabled: true
dns_dnscrypt_address: "127.0.0.1"
dns_dnscrypt_port: "55353"

# Domain resolvers: list of {domain, resolver, name} dicts
dns_custom_resolvers:
  - { name: "homelab", domain: "home.brunopaz.dev", resolver: "192.168.1.10" }
  - { name: "docker", domain: "docker.local", resolver: "172.17.0.1" }
