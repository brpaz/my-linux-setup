---
- name: Remove old dnsdock container
  community.docker.docker_container:
    name: dnsdock
    state: absent

- name: Get latest release
  community.general.github_release:
    action: latest_release
    user: MedUnes
    repo: docker-dns
    token: "{{ github_token }}"
  register: docker_dns_release

- name: Create install dir
  ansible.builtin.file:
    path: /usr/lib/docker-dns
    state: directory
    mode: "0755"
  become: true

- name: Download and extract
  ansible.builtin.unarchive:
    src: "https://github.com/MedUnes/docker-dns/releases/download/{{ docker_dns_release.tag }}/docker-dns_{{ docker_dns_release.tag | regex_replace('^v', '') }}_linux_amd64.tar.gz"
    dest: /usr/lib/docker-dns
    remote_src: true
  become: true

- name: Symlink binary
  ansible.builtin.file:
    src: /usr/lib/docker-dns/docker-dns
    dest: "{{ bin_dir }}/docker-dns"
    state: link
    force: true
  become: true

- name: Create docker-dns group
  ansible.builtin.group:
    name: docker-dns
    system: true
  become: true

- name: Create docker-dns user
  ansible.builtin.user:
    name: docker-dns
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    group: docker-dns
    groups: docker
    append: true
  become: true

- name: Create systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-dns.service
    mode: "0644"
    content: |
      [Unit]
      Description=Docker DNS Service
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      ExecStart={{ bin_dir }}/docker-dns --ip={{ docker_dns_listen_ip }} --tld={{ docker_dns_tld }}
      User=docker-dns
      Group=docker-dns
      AmbientCapabilities=CAP_NET_BIND_SERVICE
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target
  become: true
  notify: Restart docker-dns

- name: Start service
  ansible.builtin.systemd:
    name: docker-dns
    state: started
    enabled: true
    daemon_reload: true
  become: true
