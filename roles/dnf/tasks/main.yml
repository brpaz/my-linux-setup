---
- name: Install dnf plugins
  ansible.builtin.dnf:
    name: "{{ item }}"
    state: present
  loop:
    - dnf-plugins-core
    - libdnf5-plugin-actions
  become: true
- name: Install core packages
  ansible.builtin.package:
    name:
      - curl
      - wget
      - unzip
      - python-psutil
      - make
      - pwgen
      - lnav
      - httpie
      - htop
      - iotop
      - tree
      - figlet
      - nautilus-open-any-terminal
    state: present
  become: true
