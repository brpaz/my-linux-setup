---
- name: Rbw | Get latest release
  community.general.github_release:
    action: latest_release
    user: doy
    repo: rbw
    token: "{{ github_token }}"
  register: rbw_release

- name: Rbw | Download
  ansible.builtin.unarchive:
    src: "https://github.com/doy/rbw/releases/download/{{ rbw_release.tag }}/rbw_{{ rbw_release.tag }}_linux_amd64.tar.gz"
    dest: "{{ setup_dir }}"
    remote_src: true
  become: true

- name: Rbw | Install
  ansible.builtin.copy:
    src: "{{ setup_dir }}/rbw"
    dest: "{{ bin_dir }}/rbw"
    mode: a+x
  become: true

- name: Rbw | Install agent
  ansible.builtin.copy:
    src: "{{ setup_dir }}/rbw-agent"
    dest: "{{ bin_dir }}/rbw-agent"
    mode: a+x
  become: true
