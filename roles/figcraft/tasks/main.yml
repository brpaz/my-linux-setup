---
- name: Get latest release
  community.general.github_release:
    action: latest_release
    user: storytold
    repo: figcraft
    token: "{{ github_token }}"
  register: figcraft_release

- name: Install
  ansible.builtin.dnf:
    name: https://github.com/storytold/figcraft/releases/download/{{ figcraft_release.tag }}/figcraft-{{ figcraft_release.tag[1:] }}-linux-x86_64.rpm
    state: present
    disable_gpg_check: true
  become: true
