name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Install Ansible Galaxy roles
        run: |
          ansible-galaxy install -p .ansible_galaxy/roles -r requirements.yml
          ansible-galaxy collection install -p .ansible_galaxy/collections -r requirements.yml

      - name: Run Ansible Lint
        run: ansible-lint playbooks roles inventories

      - name: Check Syntax
        run: ansible-playbook --syntax-check playbooks/*.yml
